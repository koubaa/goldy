[book]
title = "Goldy"
authors = ["Mohamed Koubaa"]
description = "Reference implementation of the Fondaco Machine"
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/koubaa/goldy"
edit-url-template = "https://github.com/koubaa/goldy/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 1

