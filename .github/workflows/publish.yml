# Publish goldy Python package to PyPI
# Triggered on GitHub releases
# Uses Trusted Publishers for authentication (no API token needed)

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload built wheels to PyPI (use to republish missing platforms)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build source distribution
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/dist

  # Build wheels for Linux x86_64
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          working-directory: python
          manylinux: auto

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: python/dist

  # Build wheels for Linux aarch64 (native ARM runner)
  build-linux-aarch64:
    name: Build Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist
          working-directory: python
          manylinux: auto

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64
          path: python/dist

  # Build wheels for Windows x64
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang
          bash download.sh
          cd ../python
          python build-slang.py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: python/dist

  # Build wheels for macOS x86_64
  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-x86_64
          path: python/dist

  # Build wheels for macOS aarch64 (Apple Silicon)
  build-macos-aarch64:
    name: Build macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist
          working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: python/dist

  # Publish all wheels + sdist to PyPI
  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || inputs.publish == true
    needs:
      - build-sdist
      - build-linux-x86_64
      - build-linux-aarch64
      - build-windows
      - build-macos-x86_64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goldy/
    permissions:
      id-token: write  # Required for Trusted Publishers
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List distribution files
        run: ls -la dist/

      - name: Skip files already on PyPI
        run: |
          python3 <<'PY'
          import glob
          import json
          import os
          import urllib.request

          with urllib.request.urlopen("https://pypi.org/pypi/goldy/json") as resp:
              data = json.load(resp)

          existing = {
              file["filename"]
              for release in data.get("releases", {}).values()
              for file in release
          }

          removed = []
          for path in glob.glob("dist/*"):
              name = os.path.basename(path)
              if name in existing:
                  os.remove(path)
                  removed.append(name)

          if removed:
              print("Already on PyPI (skipped):")
              for name in sorted(removed):
                  print(f"  {name}")

          remaining = sorted(os.path.basename(p) for p in glob.glob("dist/*"))
          print(f"Uploading {len(remaining)} file(s):")
          for name in remaining:
              print(f"  {name}")
          if not remaining:
              print("Nothing new to upload.")
          PY

      - name: Publish to PyPI
        if: hashFiles('dist/**') != ''
        uses: pypa/gh-action-pypi-publish@release/v1

