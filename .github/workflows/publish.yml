# Publish goldy Python package to PyPI
# Triggered on GitHub releases
# Uses Trusted Publishers for authentication (no API token needed)

name: Publish to PyPI

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build wheels for Linux x86_64
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          working-directory: python
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: python/dist

  # TODO: Linux aarch64 cross-compilation has Docker/QEMU issues
  # Add back once resolved (possibly using native ARM runners)

  # Build wheels for Windows x64
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          working-directory: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: python/dist

  # Build wheels for macOS x86_64
  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          working-directory: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: python/dist

  # Build wheels for macOS aarch64 (Apple Silicon)
  build-macos-aarch64:
    name: Build macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist
          working-directory: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: python/dist

  # Publish all wheels to PyPI
  # Note: sdist skipped because python/Cargo.toml depends on parent goldy crate via path
  # Note: Linux aarch64 skipped due to cross-compilation issues
  publish:
    name: Publish to PyPI
    needs:
      - build-linux-x86_64
      - build-windows
      - build-macos-x86_64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goldy/
    permissions:
      id-token: write  # Required for Trusted Publishers
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

