name: Close External PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-external-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR if author is not an allowed contributor
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = ['koubaa'];
            const author = context.payload.pull_request.user.login;

            if (!allowed.includes(author)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `Hi @${author} — goldy does not accept external pull requests at this time. The project is dual-licensed and contributions are restricted to maintainers. Feel free to open an issue to discuss ideas or report bugs.`
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed'
              });
            }
