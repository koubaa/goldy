name: Downstream CI

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Goldy main to downstream repositories
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          script: |
            const goldySha =
              context.eventName === "workflow_run"
                ? context.payload.workflow_run.head_sha
                : context.sha;
            for (const repo of ["ammon", "ammon-models"]) {
              await github.rest.repos.createDispatchEvent({
                owner: "koubaa",
                repo,
                event_type: "goldy_main",
                client_payload: {
                  goldy_sha: goldySha,
                  source_run: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                },
              });
              core.info(`Dispatched ${repo} for Goldy ${goldySha}`);
            }
