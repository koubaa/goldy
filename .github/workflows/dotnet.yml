name: .NET Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'ffi/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ffi/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'

env:
  CARGO_TERM_COLOR: always
  # Lavapipe CI image (ghcr.io/koubaa/goldy/lavapipe-ci:latest) is inlined in
  # build-dotnet.container.image below — workflow env cannot be referenced there.

jobs:
  build-native:
    name: Build Native (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: goldy_ffi.dll
            runtime: win-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libgoldy_ffi.so
            runtime: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libgoldy_ffi.dylib
            runtime: osx-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libgoldy_ffi.dylib
            runtime: osx-arm64

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        # LunarG publishes apt repos through noble only. ubuntu-latest is now
        # newer than that, and its libvulkan-dev Breaks the noble vulkan-sdk
        # meta-package. The upstream tarball does not go through apt.
        SDK_VERSION=1.4.313.0
        SDK_SHA256=4e957b66ade85eeaee95932aa7e3b45aea64db373c58a5eaefc8228cc71445c2
        curl -fsSL -o /tmp/vulkan-sdk.tar.xz \
          "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkan-sdk.tar.xz"
        echo "${SDK_SHA256}  /tmp/vulkan-sdk.tar.xz" | sha256sum -c -
        sudo mkdir -p /opt/vulkan
        sudo tar -xJf /tmp/vulkan-sdk.tar.xz -C /opt/vulkan
        # shellcheck disable=SC1091
        source "/opt/vulkan/${SDK_VERSION}/setup-env.sh"
        {
          echo "VULKAN_SDK=${VULKAN_SDK}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
          echo "VK_ADD_LAYER_PATH=${VK_ADD_LAYER_PATH}"
        } >> "$GITHUB_ENV"
        echo "${VULKAN_SDK}/bin" >> "$GITHUB_PATH"
        test -x "${VULKAN_SDK}/bin/vulkaninfo"
        test -e "${VULKAN_SDK}/lib/libvulkan.so"

    - name: Download Slang
      shell: bash
      run: cd slang && chmod +x download.sh && ./download.sh

    - name: Build and bundle native libraries
      shell: bash
      run: |
        # Build goldy-ffi
        cargo build --release -p goldy-ffi --target ${{ matrix.target }}
        # Bundle with slang into runtime folder
        RUNTIME_DIR="dotnet/Goldy/runtimes/${{ matrix.runtime }}/native"
        mkdir -p "$RUNTIME_DIR"
        cp target/${{ matrix.target }}/release/${{ matrix.artifact }} "$RUNTIME_DIR/"
        # Copy slang libraries
        case "${{ matrix.runtime }}" in
          win-x64)   cp slang/bin/windows-x86_64/*.dll "$RUNTIME_DIR/" ;;
          linux-x64) cp slang/bin/linux-x86_64/*.so "$RUNTIME_DIR/" ;;
          osx-x64)   cp slang/bin/macos-x86_64/*.dylib "$RUNTIME_DIR/" ;;
          osx-arm64) cp slang/bin/macos-aarch64/*.dylib "$RUNTIME_DIR/" ;;
        esac

    - name: Upload native artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-${{ matrix.runtime }}
        path: dotnet/Goldy/runtimes/${{ matrix.runtime }}/native/*

  build-dotnet:
    name: Build and Test .NET
    needs: build-native
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Verify lavapipe
      run: DISPLAY= vulkaninfo --summary | head -30

    - name: Download all native artifacts
      uses: actions/download-artifact@v8
      with:
        path: native-libs

    - name: Copy native libraries to runtime folders
      run: |
        mkdir -p dotnet/Goldy/runtimes/win-x64/native
        mkdir -p dotnet/Goldy/runtimes/linux-x64/native
        mkdir -p dotnet/Goldy/runtimes/osx-x64/native
        mkdir -p dotnet/Goldy/runtimes/osx-arm64/native
        cp native-libs/native-win-x64/* dotnet/Goldy/runtimes/win-x64/native/
        cp native-libs/native-linux-x64/* dotnet/Goldy/runtimes/linux-x64/native/
        cp native-libs/native-osx-x64/* dotnet/Goldy/runtimes/osx-x64/native/
        cp native-libs/native-osx-arm64/* dotnet/Goldy/runtimes/osx-arm64/native/

    - name: Restore dependencies
      run: dotnet restore dotnet/Goldy.sln

    - name: Build
      run: dotnet build dotnet/Goldy.sln --no-restore --configuration Release

    - name: Test
      env:
        GOLDY_BACKEND: vulkan
      run: |
        NATIVE_DIR="$(pwd)/dotnet/Goldy.Tests/bin/Release/net8.0"
        export LD_LIBRARY_PATH="${NATIVE_DIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        dotnet test dotnet/Goldy.sln --no-build --configuration Release --verbosity normal

    - name: Pack NuGet
      run: dotnet pack dotnet/Goldy/Goldy.csproj --configuration Release --output ./nupkg

    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: ./nupkg/*.nupkg

  publish-nuget:
    name: Publish to NuGet
    needs: build-dotnet
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download NuGet package
      uses: actions/download-artifact@v8
      with:
        name: nuget-package
        path: ./nupkg

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Publish to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      continue-on-error: true

