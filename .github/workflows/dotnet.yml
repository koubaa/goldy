name: .NET Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'ffi/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ffi/**'
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: goldy_ffi.dll
            runtime: win-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libgoldy_ffi.so
            runtime: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libgoldy_ffi.dylib
            runtime: osx-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libgoldy_ffi.dylib
            runtime: osx-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux'
      run: |
        wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
        sudo apt update
        sudo apt install -y vulkan-sdk

    - name: Build goldy-ffi
      run: cargo build --release -p goldy-ffi --target ${{ matrix.target }}

    - name: Upload native artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.runtime }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-dotnet:
    name: Build and Test .NET
    needs: build-native
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        path: native-libs

    - name: Copy native libraries to runtime folders
      run: |
        mkdir -p dotnet/Goldy/runtimes/win-x64/native
        mkdir -p dotnet/Goldy/runtimes/linux-x64/native
        mkdir -p dotnet/Goldy/runtimes/osx-x64/native
        mkdir -p dotnet/Goldy/runtimes/osx-arm64/native
        cp native-libs/native-win-x64/* dotnet/Goldy/runtimes/win-x64/native/ || true
        cp native-libs/native-linux-x64/* dotnet/Goldy/runtimes/linux-x64/native/ || true
        cp native-libs/native-osx-x64/* dotnet/Goldy/runtimes/osx-x64/native/ || true
        cp native-libs/native-osx-arm64/* dotnet/Goldy/runtimes/osx-arm64/native/ || true

    - name: Restore dependencies
      run: dotnet restore dotnet/Goldy.sln

    - name: Build
      run: dotnet build dotnet/Goldy.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test dotnet/Goldy.sln --no-build --configuration Release --verbosity normal

    - name: Pack NuGet
      run: dotnet pack dotnet/Goldy/Goldy.csproj --configuration Release --output ./nupkg

    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkg/*.nupkg

  publish-nuget:
    name: Publish to NuGet
    needs: build-dotnet
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download NuGet package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ./nupkg

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      continue-on-error: true

