# Goldy CI/CD Pipeline
# Runs tests using lavapipe (Mesa's Vulkan software renderer) for GPU tests
# without requiring actual GPU hardware.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast checks that don't need GPU
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (vulkan)
        run: cargo clippy --features vulkan -- -D warnings

  # Unit tests with mock backend (no GPU needed)
  test-mock:
    name: Mock Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Run only the mock backend tests (no GPU required)
      - name: Run mock backend tests
        run: cargo test --lib backend::mock

  # Full GPU tests using lavapipe (software Vulkan)
  test-vulkan:
    name: Vulkan Tests (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # Set environment variable for Slang library path (must be full path to .so file)
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Verify lavapipe installation
        run: |
          # Find lavapipe ICD
          LAVAPIPE_ICD=$(find /usr -name "lvp_icd*.json" 2>/dev/null | head -1)
          if [ -z "$LAVAPIPE_ICD" ]; then
            echo "Lavapipe ICD not found, searching..."
            find /usr -name "*lvp*" -o -name "*lavapipe*" 2>/dev/null || true
            # Try common locations
            for path in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                        /usr/share/vulkan/icd.d/lvp_icd.json; do
              if [ -f "$path" ]; then
                LAVAPIPE_ICD="$path"
                break
              fi
            done
          fi
          
          echo "Using Lavapipe ICD: $LAVAPIPE_ICD"
          echo "LAVAPIPE_ICD=$LAVAPIPE_ICD" >> $GITHUB_ENV
          
          # Verify Vulkan works with lavapipe
          VK_ICD_FILENAMES="$LAVAPIPE_ICD" vulkaninfo --summary || echo "vulkaninfo failed, continuing anyway"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-vulkan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vulkan-

      - name: Run all tests
        env:
          # Force lavapipe as the only Vulkan driver
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          # Disable GPU validation layers for CI
          VK_LAYER_PATH: ""
          # Point to downloaded Slang library (full path to .so file)
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # LD_LIBRARY_PATH needs the directory for dependent libraries
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan

      - name: Run integration tests
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan --test '*'

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build docs
        run: cargo doc --no-deps --features vulkan
        env:
          RUSTDOCFLAGS: -D warnings

  # Windows build check (no GPU tests, just compilation)
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build with both Vulkan and DX12 features
      - name: Build (Vulkan)
        run: cargo build --features vulkan

      - name: Build (DX12)
        run: cargo build --features dx12

      - name: Build (Vulkan + DX12)
        run: cargo build --features "vulkan,dx12"

      # Run mock backend tests only (no GPU on CI)
      - name: Run mock tests
        run: cargo test --lib backend::mock

