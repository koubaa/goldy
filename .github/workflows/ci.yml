# Goldy CI/CD Pipeline
# Runs GPU tests on:
# - Linux: lavapipe (Mesa's Vulkan software renderer)
#          Requires Mesa 25.0+ for Vulkan 1.4 support in lavapipe.
# - macOS: Native Metal backend (Apple Silicon GPU, Tier 2, pinned macos-15)
#            plus macos-15-intel for non-unified-memory heap placement (#330)
# - Windows: DX12 on WARP (GOLDY_DX12_ALLOW_WARP=1; no discrete GPU on hosted runners)
# - WebGPU (wgpu): Linux Vulkan/lavapipe, macOS Metal, Windows DX12/WARP
#   (`--no-default-features --features webgpu`, GOLDY_BACKEND=webgpu)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Slang's LLVM host-callable JIT can intermittently emit AVX-512 instructions
  # unsupported by virtualized CI hosts (slang#11062), causing SIGILL/0xc000001d.
  SLANG_DISABLE_AVX512: "1"
  # Lavapipe CI image (ghcr.io/koubaa/goldy/lavapipe-ci:latest) is inlined in
  # container.image below — workflow env cannot be referenced there.

jobs:
  # Fast checks that don't need GPU
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Frame tokens and lexer tokens are not model vocabulary, so `token` is not in this list.
      - name: No model vocabulary
        run: |
          set -euo pipefail
          if git grep -n -I -E -i \
            -e '\bexperts?\b' \
            -e '\bmoe\b' \
            -e '\brouter\b' \
            -e '\btop[-_ ]?k\b' \
            -e '\bswiglu\b' \
            -e '\battention\b' \
            -- src shader_ir tests docs; then
            echo "model vocabulary is not allowed in goldy"
            exit 1
          fi

      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (vulkan)
        run: cargo clippy --features vulkan -- -D warnings

      - name: Clippy (webgpu)
        run: cargo clippy --no-default-features --features webgpu -- -D warnings

      # Compile-only: CUDA feature set without `graphics` (clippy debt tracked separately)
      - name: Check (cuda compute-only)
        run: cargo check --no-default-features --features cuda

  # Unit tests with mock backend (no GPU needed)
  test-mock:
    name: Mock Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Run only the mock backend tests (no GPU required)
      - name: Run mock backend tests
        run: cargo test --lib backend::mock

  # Full GPU tests using lavapipe (software Vulkan)
  # Requires Mesa 25.0+ for Vulkan 1.4 support (provided by LAVAPIPE_CI_IMAGE)
  test-vulkan:
    name: Vulkan Tests (lavapipe)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest
    env:
      GOLDY_VALIDATION: all
      GOLDY_VALIDATION_FATAL: "1"
      VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Slang download deps
        run: |
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # Set environment variable for Slang library path (must be full path to .so file)
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Verify lavapipe
        run: DISPLAY= vulkaninfo --summary | head -30

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-vulkan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vulkan-

      - name: Run all tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan

      - name: Run integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan --test '*'

      - name: Run goldy-ffi integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test -p goldy-ffi --features vulkan

  # Full GPU tests using native Metal backend (macOS)
  test-metal:
    name: Metal Tests (macOS)
    runs-on: macos-15
    env:
      MTL_DEBUG_LAYER: "1"
      MTL_SHADER_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # macOS runners are Apple Silicon (arm64)
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-metal-

      - name: Debug mesh_dispatch (Metal)
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
          GOLDY_DUMP_SHADERS: ${{ runner.temp }}/goldy-mesh-msl
          MTL_DEBUG_LAYER: "1"
          MTL_SHADER_VALIDATION: "1"
          RUST_BACKTRACE: "1"
        run: |
          echo "=== host ==="
          sw_vers
          system_profiler SPDisplaysDataType || true
          cargo test --test mesh_dispatch -- --nocapture
          echo "=== dumped MSL ==="
          ls -la "${GOLDY_DUMP_SHADERS}" || true
          if [ -d "${GOLDY_DUMP_SHADERS}" ]; then
            for f in "${GOLDY_DUMP_SHADERS}"/*; do
              echo "----- $f -----"
              cat "$f"
            done
          fi

      - name: Run all tests
        env:
          # Point to downloaded Slang library
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # DYLD_LIBRARY_PATH for macOS dynamic library loading
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test

      - name: Run integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --test '*'

      - name: Run goldy-ffi integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test -p goldy-ffi

      # Private heaps and Private textures are legal on Apple silicon, so the
      # same runner exercises the non-Apple placement. A Shared heap or texture
      # in this mode panics.
      - name: Run all tests (discrete placement)
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
          GOLDY_METAL_PLACEMENT: discrete
        run: cargo test

      - name: Run integration tests (discrete placement)
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
          GOLDY_METAL_PLACEMENT: discrete
        run: cargo test --test '*'

      - name: Run goldy-ffi integration tests (discrete placement)
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
          GOLDY_METAL_PLACEMENT: discrete
        run: cargo test -p goldy-ffi

  # Intel macOS (paravirtual GPU). The probe records whether Shared / Managed /
  # Private MTLHeaps are accepted. A nil heap or a missing Argument Buffers
  # Tier 2 means this VM cannot run Goldy, so those outcomes are logged and the
  # storage-mode unit tests still run. GPU tests run only when Tier 2 is present.
  test-metal-intel:
    name: Metal Tests (macOS Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Host and display
        run: |
          echo "=== host ==="
          uname -m
          sw_vers
          system_profiler SPDisplaysDataType || true

      - name: Probe Metal heap storage modes
        id: metal_probe
        run: |
          set +e
          swift scripts/metal_shared_heap_probe.swift > "$RUNNER_TEMP/metal-info.txt" 2>&1
          info_status=$?
          set -e
          echo "=== device ==="
          cat "$RUNNER_TEMP/metal-info.txt"
          {
            echo "## Intel Metal device"
            echo '```'
            cat "$RUNNER_TEMP/metal-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$info_status" -eq 2 ]; then
            echo "METAL_GPU_TESTS=0" >> "$GITHUB_ENV"
            echo "No MTLDevice on this runner. GPU tests skipped; storage-mode unit tests still run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$info_status" -ne 0 ]; then
            echo "Metal capability probe failed with exit $info_status"
            exit 1
          fi

          unified=$(grep -o 'unified=[^ ]*' "$RUNNER_TEMP/metal-info.txt" | head -1 | cut -d= -f2)
          tier2=$(grep -o 'tier2=[^ ]*' "$RUNNER_TEMP/metal-info.txt" | head -1 | cut -d= -f2)
          echo "unified=$unified tier2=$tier2"

          probe_heap() {
            local flag="$1"
            local out="$RUNNER_TEMP/heap-${flag}.txt"
            local status_file="$RUNNER_TEMP/heap-${flag}.status"
            set +e
            swift scripts/metal_shared_heap_probe.swift "$flag" > "$out" 2>&1
            local status=$?
            set -e
            echo "$status" > "$status_file"
            echo "=== $flag exit=$status ==="
            cat "$out" || true
          }

          # Print every attempt before deciding. Command substitution hid these
          # logs when an earlier version exited on the private-heap result.
          probe_heap --shared-heap
          probe_heap --managed-heap
          probe_heap --private-heap
          shared_status=$(cat "$RUNNER_TEMP/heap---shared-heap.status")
          managed_status=$(cat "$RUNNER_TEMP/heap---managed-heap.status")
          private_status=$(cat "$RUNNER_TEMP/heap---private-heap.status")

          {
            echo "## Heap probes (exit status)"
            echo "- shared: \`$shared_status\`"
            echo "- managed: \`$managed_status\`"
            echo "- private: \`$private_status\`"
            echo '```'
            echo "--- shared ---"
            cat "$RUNNER_TEMP/heap---shared-heap.txt" || true
            echo "--- managed ---"
            cat "$RUNNER_TEMP/heap---managed-heap.txt" || true
            echo "--- private ---"
            cat "$RUNNER_TEMP/heap---private-heap.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 1 is a Swift failure (the script did not run). 3 is makeHeap -> nil.
          # 132/133/134/138/139 are signal aborts from the heap validator.
          for pair in "shared:$shared_status" "managed:$managed_status" "private:$private_status"; do
            status="${pair#*:}"
            if [ "$status" -eq 1 ]; then
              echo "Heap probe failed to run ($pair)."
              exit 1
            fi
          done

          if grep -qi "shared storage mode" "$RUNNER_TEMP/heap---shared-heap.txt"; then
            echo "Shared MTLHeap aborted with 'Shared storage mode disallowed'." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$shared_status" -eq 0 ]; then
            echo "Shared MTLHeap was created." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$shared_status" -eq 3 ]; then
            echo "Shared MTLHeap returned nil (no assertion)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Shared MTLHeap exited $shared_status." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$private_status" -eq 0 ]; then
            echo "Private MTLHeap was created." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$private_status" -eq 3 ]; then
            echo "Private MTLHeap returned nil. This GPU cannot host an MTLHeap the way Goldy allocates one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Private MTLHeap exited $private_status." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Goldy requires Tier 2 before it creates heaps, so a device without
          # Tier 2 never reaches the #330 assertion. Skip GPU tests then.
          if [ "$tier2" = "true" ] && [ "$private_status" -eq 0 ]; then
            echo "METAL_GPU_TESTS=1" >> "$GITHUB_ENV"
          else
            echo "METAL_GPU_TESTS=0" >> "$GITHUB_ENV"
            echo "Goldy GPU tests skipped (tier2=$tier2, private_heap_exit=$private_status). Storage-mode unit tests still run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-metal-intel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-metal-intel-

      - name: Storage-mode unit tests
        run: cargo test --lib metal_storage

      - name: Runtime creation returns an error below the floor
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --lib creating_device_does_not_abort_when_below_floor -- --nocapture

      - name: Run Metal device, compute, and offscreen render
        if: env.METAL_GPU_TESTS == '1'
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          cargo test --lib heap_storage_follows_apple_family
          cargo test --lib test_metal_device_creation
          cargo test --test scheme_compute_integration -- scheme_compute_write_and_readback scheme_cpu_readable_compute_write_and_read scheme_write_texture_round_trip scheme_compute_with_uav_parcel
          cargo test --test scheme_screenshot_tests -- scheme_solid_red scheme_rgb_triangle

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build docs
        run: cargo doc --no-deps --features vulkan
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.43/mdbook-v0.4.43-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory /usr/local/bin

      - name: Build book
        run: scripts/check_docs_book.sh

  # Windows build check (no GPU tests, just compilation)
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build with both Vulkan and DX12 features
      - name: Build (Vulkan)
        run: cargo build --features vulkan

      - name: Build (DX12)
        run: cargo build --features dx12

      - name: Build (Vulkan + DX12)
        run: cargo build --features "vulkan,dx12"

      - name: Build (WebGPU)
        run: cargo build --no-default-features --features webgpu

      # Run mock backend tests only (no GPU on CI)
      - name: Run mock tests
        run: cargo test --lib backend::mock

  # DirectX 12 GPU tests using WARP (software rasterizer; no discrete GPU on runner)
  test-dx12-warp:
    name: DX12 Tests (WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-dx12-warp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dx12-warp-

      - name: Add Windows SDK DXC to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      # WARP on hosted Windows runners is unstable when multiple test threads in the
      # same process interleave GPU work on the shared DX12 backend (STATUS_ACCESS_VIOLATION
      # on queue Signal). cargo nextest with --test-threads=1 runs one integration test
      # worker at a time, which avoids that path; hardware drivers do not show the issue.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests (DX12 + WARP)
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
        run: cargo nextest run --features dx12 --test-threads=1

      - name: Run goldy-ffi integration tests (DX12 + WARP)
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
        run: cargo nextest run -p goldy-ffi --features dx12 --test-threads=1

  # WebGPU tests via wgpu (Linux: Vulkan/lavapipe)
  test-webgpu-linux:
    name: WebGPU Tests (Linux / lavapipe)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest
    env:
      GOLDY_VALIDATION: all
      GOLDY_VALIDATION_FATAL: "1"
      VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Slang download deps
        run: |
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Verify lavapipe
        run: DISPLAY= vulkaninfo --summary | head -30

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-webgpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-webgpu-

      - name: Run all tests
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: vulkan
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --no-default-features --features webgpu

      - name: Run integration tests
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: vulkan
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --no-default-features --features webgpu --test '*'

      - name: Run goldy-ffi integration tests
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: vulkan
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test -p goldy-ffi --no-default-features --features webgpu

  # WebGPU tests via wgpu (macOS: Metal)
  test-webgpu-macos:
    name: WebGPU Tests (macOS / Metal)
    runs-on: macos-15
    env:
      GOLDY_VALIDATION: all
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-webgpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-webgpu-

      - name: Run all tests
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: metal
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --no-default-features --features webgpu

      - name: Run integration tests
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: metal
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --no-default-features --features webgpu --test '*'

      - name: Run goldy-ffi integration tests
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: metal
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test -p goldy-ffi --no-default-features --features webgpu

  # WebGPU tests via wgpu (Windows: DX12 WARP)
  test-webgpu-windows:
    name: WebGPU Tests (Windows / DX12 WARP)
    runs-on: windows-latest
    env:
      GOLDY_VALIDATION: all
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-webgpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-webgpu-

      - name: Add Windows SDK DXC to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Hosted Windows runners have no discrete GPU. wgpu's fallback adapter is WARP.
      # Serialize like native DX12+WARP: parallel GPU work on WARP is unstable.
      - name: Run tests (WebGPU + WARP)
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: dx12
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: cargo nextest run --no-default-features --features webgpu --test-threads=1

      - name: Run goldy-ffi integration tests (WebGPU + WARP)
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: dx12
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: cargo nextest run -p goldy-ffi --no-default-features --features webgpu --test-threads=1

  # Python bindings build and test (Linux with lavapipe)
  python-linux:
    name: Python Bindings (Linux)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest
    needs: [check, test-mock]
    env:
      GOLDY_VALIDATION: all
      GOLDY_VALIDATION_FATAL: "1"
      VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system Python
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-dev ca-certificates
          python3 -m venv /opt/py
          echo "/opt/py/bin" >> "$GITHUB_PATH"
          rm -rf /var/lib/apt/lists/*

      - name: Install Slang download deps
        run: |
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Verify lavapipe
        run: DISPLAY= vulkaninfo --summary | head -30

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          python -m pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        run: |
          python -m pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          python examples/game_of_life_headless.py

