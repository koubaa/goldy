# Goldy CI/CD Pipeline
# Runs GPU tests on:
# - Linux: lavapipe (Mesa's Vulkan software renderer)
#          Requires Mesa 25.0+ for Vulkan 1.4 support in lavapipe. 
# - macOS: Native Metal backend (Apple Silicon GPU)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast checks that don't need GPU
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (vulkan)
        run: cargo clippy --features vulkan -- -D warnings

  # Unit tests with mock backend (no GPU needed)
  test-mock:
    name: Mock Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Run only the mock backend tests (no GPU required)
      - name: Run mock backend tests
        run: cargo test --lib backend::mock

  # Full GPU tests using lavapipe (software Vulkan)
  # Requires Mesa 25.0+ for Vulkan 1.4 support
  test-vulkan:
    name: Vulkan Tests (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan dependencies (Mesa 25.0+ for Vulkan 1.4)
        run: |
          # Upgrade Mesa to get Vulkan 1.4 support in lavapipe
          sudo apt-get update
          sudo apt-get upgrade -y mesa-vulkan-drivers libgl1-mesa-dri
          sudo apt-get install -y \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # Set environment variable for Slang library path (must be full path to .so file)
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Verify lavapipe installation
        run: |
          # Find lavapipe ICD
          LAVAPIPE_ICD=$(find /usr -name "lvp_icd*.json" 2>/dev/null | head -1)
          if [ -z "$LAVAPIPE_ICD" ]; then
            echo "Lavapipe ICD not found, searching..."
            find /usr -name "*lvp*" -o -name "*lavapipe*" 2>/dev/null || true
            # Try common locations
            for path in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                        /usr/share/vulkan/icd.d/lvp_icd.json; do
              if [ -f "$path" ]; then
                LAVAPIPE_ICD="$path"
                break
              fi
            done
          fi
          
          echo "Using Lavapipe ICD: $LAVAPIPE_ICD"
          echo "LAVAPIPE_ICD=$LAVAPIPE_ICD" >> $GITHUB_ENV
          
          # Verify Vulkan works with lavapipe
          VK_ICD_FILENAMES="$LAVAPIPE_ICD" vulkaninfo --summary || echo "vulkaninfo failed, continuing anyway"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-vulkan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vulkan-

      - name: Run all tests
        env:
          # Force lavapipe as the only Vulkan driver
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          # Disable GPU validation layers for CI
          VK_LAYER_PATH: ""
          # Point to downloaded Slang library (full path to .so file)
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # LD_LIBRARY_PATH needs the directory for dependent libraries
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan

      - name: Run integration tests
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan --test '*'

  # Full GPU tests using native Metal backend (macOS)
  test-metal:
    name: Metal Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # macOS runners are Apple Silicon (arm64)
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-metal-

      - name: Run all tests
        env:
          # Point to downloaded Slang library
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # DYLD_LIBRARY_PATH for macOS dynamic library loading
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test

      - name: Run integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --test '*'

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build docs
        run: cargo doc --no-deps --features vulkan
        env:
          RUSTDOCFLAGS: -D warnings

  # Windows build check (no GPU tests, just compilation)
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build with both Vulkan and DX12 features
      - name: Build (Vulkan)
        run: cargo build --features vulkan

      - name: Build (DX12)
        run: cargo build --features dx12

      - name: Build (Vulkan + DX12)
        run: cargo build --features "vulkan,dx12"

      # Run mock backend tests only (no GPU on CI)
      - name: Run mock tests
        run: cargo test --lib backend::mock

  # Python bindings build and test (Linux with lavapipe)
  python-linux:
    name: Python Bindings (Linux)
    runs-on: ubuntu-24.04
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Vulkan dependencies (Mesa 25.0+ for Vulkan 1.4)
        run: |
          # Upgrade Mesa to get Vulkan 1.4 support in lavapipe
          sudo apt-get update
          sudo apt-get upgrade -y mesa-vulkan-drivers libgl1-mesa-dri
          sudo apt-get install -y \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV

      - name: Verify lavapipe installation
        run: |
          LAVAPIPE_ICD=$(find /usr -name "lvp_icd*.json" 2>/dev/null | head -1)
          if [ -z "$LAVAPIPE_ICD" ]; then
            for path in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                        /usr/share/vulkan/icd.d/lvp_icd.json; do
              if [ -f "$path" ]; then
                LAVAPIPE_ICD="$path"
                break
              fi
            done
          fi
          echo "LAVAPIPE_ICD=$LAVAPIPE_ICD" >> $GITHUB_ENV
          VK_ICD_FILENAMES="$LAVAPIPE_ICD" vulkaninfo --summary || true

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          python examples/game_of_life.py

  # Python bindings build and test (macOS with native Metal)
  python-macos:
    name: Python Bindings (macOS)
    runs-on: macos-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          python examples/game_of_life.py

  # Python bindings build (Windows)
  python-windows:
    name: Python Bindings (Windows)
    runs-on: windows-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin
        run: pip install maturin numpy

      - name: Build Python bindings
        working-directory: python
        run: maturin build --release

      # Note: Can't run GPU tests on Windows CI without hardware
      # Just verify the build succeeds

  # =============================================================================
  # C++ Bindings
  # =============================================================================

  # C++ bindings build and test (Linux with lavapipe)
  cpp-linux:
    name: C++ Bindings (Linux)
    runs-on: ubuntu-24.04
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies (Mesa 25.0+ for Vulkan 1.4)
        run: |
          # Upgrade Mesa to get Vulkan 1.4 support in lavapipe
          sudo apt-get update
          sudo apt-get upgrade -y mesa-vulkan-drivers libgl1-mesa-dri
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV

      - name: Verify lavapipe installation
        run: |
          LAVAPIPE_ICD=$(find /usr -name "lvp_icd*.json" 2>/dev/null | head -1)
          if [ -z "$LAVAPIPE_ICD" ]; then
            for path in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                        /usr/share/vulkan/icd.d/lvp_icd.json; do
              if [ -f "$path" ]; then
                LAVAPIPE_ICD="$path"
                break
              fi
            done
          fi
          echo "LAVAPIPE_ICD=$LAVAPIPE_ICD" >> $GITHUB_ENV
          VK_ICD_FILENAMES="$LAVAPIPE_ICD" vulkaninfo --summary || true

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDY_BUILD_FROM_SOURCE=OFF \
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build

      - name: Run triangle example
        working-directory: cpp/build/examples
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          ./triangle
          # Verify output file was created
          test -f triangle.ppm && echo "✓ triangle.ppm created successfully"

  # C++ bindings build and test (macOS with native Metal)
  cpp-macos:
    name: C++ Bindings (macOS)
    runs-on: macos-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          brew install cmake ninja

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # Determine architecture
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDY_BUILD_FROM_SOURCE=OFF \
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build

      - name: Run triangle example
        working-directory: cpp/build/examples
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          ./triangle
          # Verify output file was created
          test -f triangle.ppm && echo "✓ triangle.ppm created successfully"

  # C++ bindings build (Windows)
  cpp-windows:
    name: C++ Bindings (Windows)
    runs-on: windows-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGOLDY_BUILD_FROM_SOURCE=OFF `
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build --config Release

      # Note: Can't run GPU tests on Windows CI without hardware
      # Just verify the build succeeds

