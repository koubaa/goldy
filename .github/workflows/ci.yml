# Slim throwaway workflow: WebGPU Tests (Windows / DX12 WARP) only.
# Product tree is origin/main. Do not isolate yielding_cpu — the SIGILL
# (0xc000001d) has only been seen in the complete wgpu dx12 warp job.
#
# Frozen recipe matches stock CI: full nextest + goldy-ffi, GOLDY_BACKEND=webgpu,
# WGPU_BACKEND=dx12, WGPU_FORCE_FALLBACK_ADAPTER=1, GOLDY_VALIDATION=all,
# --test-threads=1. Matrix of 4, fail-fast false, to sample the flake.

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/bisect-yielding-cpu-webgpu-dx12-3d18

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-webgpu-windows:
    name: WebGPU Tests (Windows / DX12 WARP)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    env:
      GOLDY_VALIDATION: all
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-webgpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-webgpu-

      - name: Add Windows SDK DXC to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Hosted Windows runners have no discrete GPU. wgpu's fallback adapter is WARP.
      # Serialize like native DX12+WARP: parallel GPU work on WARP is unstable.
      - name: Run tests (WebGPU + WARP)
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: dx12
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: cargo nextest run --no-default-features --features webgpu --test-threads=1

      - name: Run goldy-ffi integration tests (WebGPU + WARP)
        env:
          GOLDY_BACKEND: webgpu
          WGPU_BACKEND: dx12
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: cargo nextest run -p goldy-ffi --no-default-features --features webgpu --test-threads=1
