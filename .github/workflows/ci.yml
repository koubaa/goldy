# Slim DX12-only workflow to test whether waiting in LeaseInner::drop
# clears goldy::yielding_cpu::chained_continuations_with_multi_element_results
# ABORT 0xc000001d on Windows DX12/WARP.
#
# Throwaway overlay: do not merge this workflow into cleanup-api.
# Product CI stays on cleanup-api / main. This file exists so `push` to the
# fix branch actually runs the reproducing job (stock ci.yml only fires on
# pull_request to main/master).
#
# Recipe matches the failing DX12 Tests (WARP) job: full unfiltered nextest
# plus goldy-ffi, GOLDY_BACKEND=dx12, WARP, --test-threads=1.
# Matrix of 4 with fail-fast: false — isolation of yielding_cpu never aborted;
# the abort is a ~25–50% flake of the full 1077-test suite.

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-lease-inner-drop-wait-3d18
  pull_request:
    branches:
      - cleanup-api

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # DirectX 12 GPU tests using WARP (software rasterizer; no discrete GPU on runner)
  test-dx12-warp:
    name: DX12 Tests (WARP)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-dx12-warp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dx12-warp-

      - name: Add Windows SDK DXC to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      # WARP on hosted Windows runners is unstable when multiple test threads in the
      # same process interleave GPU work on the shared DX12 backend (STATUS_ACCESS_VIOLATION
      # on queue Signal). cargo nextest with --test-threads=1 runs one integration test
      # worker at a time, which avoids that path; hardware drivers do not show the issue.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests (DX12 + WARP)
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
        run: cargo nextest run --features dx12 --test-threads=1

      - name: Run goldy-ffi integration tests (DX12 + WARP)
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
        run: cargo nextest run -p goldy-ffi --features dx12 --test-threads=1
