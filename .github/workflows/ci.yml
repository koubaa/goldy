# Goldy CI/CD Pipeline
# Runs GPU tests on:
# - Linux: lavapipe (Mesa's Vulkan software renderer)
#          Requires Mesa 25.0+ for Vulkan 1.4 support in lavapipe. 
# - macOS: Native Metal backend (Apple Silicon GPU, Tier 2, pinned macos-15)
# - Windows: DX12 on WARP (GOLDY_DX12_ALLOW_WARP=1; no discrete GPU on hosted runners)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast checks that don't need GPU
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (vulkan)
        run: cargo clippy --features vulkan -- -D warnings

  # Unit tests with mock backend (no GPU needed)
  test-mock:
    name: Mock Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Run only the mock backend tests (no GPU required)
      - name: Run mock backend tests
        run: cargo test --lib backend::mock

  # Full GPU tests using lavapipe (software Vulkan)
  # Requires Mesa 25.0+ for Vulkan 1.4 support
  test-vulkan:
    name: Vulkan Tests (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      # Patched lavapipe: https://gitlab.freedesktop.org/mesa/mesa/-/work_items/15227
      # Remove this step and restore mesa-vulkan-drivers from apt once the upstream fix lands.
      - name: Install patched lavapipe from mesa-fork
        run: |
          MESA_DIR="/opt/mesa-fork"
          sudo mkdir -p "$MESA_DIR"
          curl -sL https://github.com/koubaa/mesa-fork/releases/download/v1/lavapipe-fix.tar.gz \
            | sudo tar xz -C "$MESA_DIR"
          echo "LAVAPIPE_ICD=$MESA_DIR/lvp_icd.x86_64.json" >> $GITHUB_ENV
          VK_ICD_FILENAMES="$MESA_DIR/lvp_icd.x86_64.json" vulkaninfo --summary || echo "vulkaninfo failed, continuing anyway"

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-vulkan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vulkan-

      - name: Run all tests
        env:
          # Force lavapipe as the only Vulkan driver
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          # Disable GPU validation layers for CI
          VK_LAYER_PATH: ""
          # Point to downloaded Slang library (full path to .so file)
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # LD_LIBRARY_PATH needs the directory for dependent libraries
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan

      - name: Run integration tests
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan --test '*'

  # Full GPU tests using native Metal backend (macOS)
  test-metal:
    name: Metal Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # macOS runners are Apple Silicon (arm64)
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-metal-

      - name: Run all tests
        env:
          # Point to downloaded Slang library
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # DYLD_LIBRARY_PATH for macOS dynamic library loading
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test

      - name: Run integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --test '*'

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build docs
        run: cargo doc --no-deps --features vulkan
        env:
          RUSTDOCFLAGS: -D warnings

  # Windows build check (no GPU tests, just compilation)
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build with both Vulkan and DX12 features
      - name: Build (Vulkan)
        run: cargo build --features vulkan

      - name: Build (DX12)
        run: cargo build --features dx12

      - name: Build (Vulkan + DX12)
        run: cargo build --features "vulkan,dx12"

      # Run mock backend tests only (no GPU on CI)
      - name: Run mock tests
        run: cargo test --lib backend::mock

  # DirectX 12 GPU tests using WARP (software rasterizer; no discrete GPU on runner)
  test-dx12-warp:
    name: DX12 Tests (WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-dx12-warp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dx12-warp-

      - name: Add Windows SDK DXC to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      - name: "Repro Level 1: simple copy"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "50"
        run: cargo test --features dx12 --test compute_integration -- test_warp_repro_level1_simple_copy --exact --nocapture
        continue-on-error: true

      - name: "Repro Level 2: groupshared"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "50"
        run: cargo test --features dx12 --test compute_integration -- test_warp_repro_level2_groupshared --exact --nocapture
        continue-on-error: true

      - name: "Repro Level 3: one Ekrano shader"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "50"
        run: cargo test --features dx12 --test compute_integration -- test_warp_repro_level3_one_ekrano_shader --exact --nocapture
        continue-on-error: true

      - name: "Repro Level 4: three Ekrano shaders"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "50"
        run: cargo test --features dx12 --test compute_integration -- test_warp_repro_level4_three_ekrano_shaders --exact --nocapture
        continue-on-error: true

      - name: "Full pipeline (known reproducer)"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "50"
        run: cargo test --features dx12 --test compute_integration -- test_warp_srv_full_pipeline --exact --nocapture
        continue-on-error: true

      - name: "All WARP tests together (cumulative descriptor state)"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "0"
        run: cargo test --features dx12 --test compute_integration -- test_warp_srv --nocapture
        continue-on-error: true

      - name: "All repro levels together (cumulative)"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "0"
        run: cargo test --features dx12 --test compute_integration -- test_warp_repro --nocapture
        continue-on-error: true

      - name: "All WARP + repro tests together (max cumulative)"
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
          WARP_POLLUTION: "0"
        run: cargo test --features dx12 --test compute_integration -- "test_warp_(srv|repro)" --nocapture
        continue-on-error: true

  # Python bindings build and test (Linux with lavapipe)
  python-linux:
    name: Python Bindings (Linux)
    runs-on: ubuntu-24.04
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      # Patched lavapipe: https://gitlab.freedesktop.org/mesa/mesa/-/work_items/15227
      - name: Install patched lavapipe from mesa-fork
        run: |
          MESA_DIR="/opt/mesa-fork"
          sudo mkdir -p "$MESA_DIR"
          curl -sL https://github.com/koubaa/mesa-fork/releases/download/v1/lavapipe-fix.tar.gz \
            | sudo tar xz -C "$MESA_DIR"
          echo "LAVAPIPE_ICD=$MESA_DIR/lvp_icd.x86_64.json" >> $GITHUB_ENV
          VK_ICD_FILENAMES="$MESA_DIR/lvp_icd.x86_64.json" vulkaninfo --summary || true

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
        run: |
          pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          # game_of_life.py requires a display (GLFW window) - skipped on headless Linux CI

  # Python bindings build and test (macOS with native Metal)
  python-macos:
    name: Python Bindings (macOS)
    runs-on: macos-15
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        run: |
          pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          python examples/game_of_life.py

  # Python bindings build (Windows)
  python-windows:
    name: Python Bindings (Windows)
    runs-on: windows-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin
        run: pip install maturin numpy

      - name: Build Python bindings
        working-directory: python
        run: maturin build --release

      # Note: Can't run GPU tests on Windows CI without hardware
      # Just verify the build succeeds

  # =============================================================================
  # C++ Bindings
  # =============================================================================

  # C++ bindings build and test (Linux with lavapipe)
  cpp-linux:
    name: C++ Bindings (Linux)
    runs-on: ubuntu-24.04
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libvulkan1 \
            libvulkan-dev \
            vulkan-tools \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      # Patched lavapipe: https://gitlab.freedesktop.org/mesa/mesa/-/work_items/15227
      - name: Install patched lavapipe from mesa-fork
        run: |
          MESA_DIR="/opt/mesa-fork"
          sudo mkdir -p "$MESA_DIR"
          curl -sL https://github.com/koubaa/mesa-fork/releases/download/v1/lavapipe-fix.tar.gz \
            | sudo tar xz -C "$MESA_DIR"
          echo "LAVAPIPE_ICD=$MESA_DIR/lvp_icd.x86_64.json" >> $GITHUB_ENV
          VK_ICD_FILENAMES="$MESA_DIR/lvp_icd.x86_64.json" vulkaninfo --summary || true

      - name: Download Slang
        run: cd slang && chmod +x download.sh && ./download.sh

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDY_BUILD_FROM_SOURCE=OFF \
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build

      - name: Run triangle example
        working-directory: cpp/build/examples
        env:
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
        run: |
          ./triangle
          # Verify output file was created
          test -f triangle.ppm && echo "✓ triangle.ppm created successfully"

  # C++ bindings build and test (macOS with native Metal)
  cpp-macos:
    name: C++ Bindings (macOS)
    runs-on: macos-15
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          brew install cmake ninja

      - name: Download Slang
        run: cd slang && chmod +x download.sh && ./download.sh

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDY_BUILD_FROM_SOURCE=OFF \
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build

      - name: Run triangle example
        working-directory: cpp/build/examples
        run: |
          ./triangle
          # Verify output file was created
          test -f triangle.ppm && echo "✓ triangle.ppm created successfully"

  # C++ bindings build (Windows)
  cpp-windows:
    name: C++ Bindings (Windows)
    runs-on: windows-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGOLDY_BUILD_FROM_SOURCE=OFF `
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build --config Release

      # Note: Can't run GPU tests on Windows CI without hardware
      # Just verify the build succeeds

