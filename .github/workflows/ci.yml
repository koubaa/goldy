# Goldy CI/CD Pipeline
# Runs GPU tests on:
# - Linux: lavapipe (Mesa's Vulkan software renderer)
#          Requires Mesa 25.0+ for Vulkan 1.4 support in lavapipe. 
# - macOS: Native Metal backend (Apple Silicon GPU, Tier 2, pinned macos-15)
# - Windows: DX12 on WARP (GOLDY_DX12_ALLOW_WARP=1; no discrete GPU on hosted runners)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Lavapipe CI image (ghcr.io/koubaa/goldy/lavapipe-ci:latest) is inlined in
  # container.image below — workflow env cannot be referenced there.

jobs:
  # Fast checks that don't need GPU
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy (vulkan)
        run: cargo clippy --features vulkan -- -D warnings

  # Unit tests with mock backend (no GPU needed)
  test-mock:
    name: Mock Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Run only the mock backend tests (no GPU required)
      - name: Run mock backend tests
        run: cargo test --lib backend::mock

  # Full GPU tests using lavapipe (software Vulkan)
  # Requires Mesa 25.0+ for Vulkan 1.4 support (provided by LAVAPIPE_CI_IMAGE)
  test-vulkan:
    name: Vulkan Tests (lavapipe)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Slang download deps
        run: |
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # Set environment variable for Slang library path (must be full path to .so file)
          SLANG_DIR="$(pwd)/bin/linux-x86_64"
          SLANG_LIB="$SLANG_DIR/libslang.so"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Verify lavapipe
        run: DISPLAY= vulkaninfo --summary | head -30

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-vulkan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vulkan-

      - name: Run all tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan

      - name: Run integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --features vulkan --test '*'

      - name: Run goldy-ffi integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          LD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test -p goldy-ffi --features vulkan

  # Full GPU tests using native Metal backend (macOS)
  test-metal:
    name: Metal Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Slang compiler
        run: |
          cd slang
          chmod +x download.sh
          ./download.sh
          # macOS runners are Apple Silicon (arm64)
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          SLANG_LIB="$SLANG_DIR/libslang.dylib"
          echo "GOLDY_SLANG_PATH=$SLANG_LIB" >> $GITHUB_ENV
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> $GITHUB_ENV
          echo "Slang libraries:"
          ls -la "$SLANG_DIR" || echo "Directory not found"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-metal-

      - name: Run all tests
        env:
          # Point to downloaded Slang library
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          # DYLD_LIBRARY_PATH for macOS dynamic library loading
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test

      - name: Run integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test --test '*'

      - name: Run goldy-ffi integration tests
        env:
          GOLDY_SLANG_PATH: ${{ env.GOLDY_SLANG_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: cargo test -p goldy-ffi

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build docs
        run: cargo doc --no-deps --features vulkan
        env:
          RUSTDOCFLAGS: -D warnings

  # Windows build check (no GPU tests, just compilation)
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build with both Vulkan and DX12 features
      - name: Build (Vulkan)
        run: cargo build --features vulkan

      - name: Build (DX12)
        run: cargo build --features dx12

      - name: Build (Vulkan + DX12)
        run: cargo build --features "vulkan,dx12"

      # Run mock backend tests only (no GPU on CI)
      - name: Run mock tests
        run: cargo test --lib backend::mock

  # DirectX 12 GPU tests using WARP (software rasterizer; no discrete GPU on runner)
  test-dx12-warp:
    name: DX12 Tests (WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-dx12-warp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dx12-warp-

      - name: Add Windows SDK DXC to PATH
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      # WARP on hosted Windows runners is unstable when multiple test threads in the
      # same process interleave GPU work on the shared DX12 backend (STATUS_ACCESS_VIOLATION
      # on queue Signal). cargo nextest with --test-threads=1 runs one integration test
      # worker at a time, which avoids that path; hardware drivers do not show the issue.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests (DX12 + WARP)
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
        run: cargo nextest run --features dx12 --test-threads=1

      - name: Run goldy-ffi integration tests (DX12 + WARP)
        env:
          GOLDY_BACKEND: dx12
          GOLDY_DX12_ALLOW_WARP: "1"
          GOLDY_DX12_NO_DEBUG: "1"
        run: cargo nextest run -p goldy-ffi --features dx12 --test-threads=1

  # Python bindings build and test (Linux with lavapipe)
  python-linux:
    name: Python Bindings (Linux)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Slang download deps
        run: |
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Verify lavapipe
        run: DISPLAY= vulkaninfo --summary | head -30

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          python -m pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        run: |
          python -m pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          python examples/game_of_life_headless.py

  # Python bindings build and test (macOS with native Metal)
  python-macos:
    name: Python Bindings (macOS)
    runs-on: macos-15
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and bundle Slang
        run: |
          cd slang && chmod +x download.sh && ./download.sh
          cd ../python && python build-slang.py

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin and dependencies
        run: |
          pip install maturin numpy pillow pytest

      - name: Install and test Python bindings
        working-directory: python
        run: |
          pip install .
          pytest tests/ -v

      - name: Run Python examples
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/adapter_info.py
          python examples/compute_demo.py
          python examples/game_of_life_headless.py

  # Python bindings build (Windows)
  python-windows:
    name: Python Bindings (Windows)
    runs-on: windows-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Match other Windows jobs: cache cargo before setup-python so actions/cache sees the Rust-only env.
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin numpy

      - name: Build Python bindings
        working-directory: python
        run: maturin build --release

      # Note: Can't run GPU tests on Windows CI without hardware
      # Just verify the build succeeds

  # =============================================================================
  # C++ Bindings
  # =============================================================================

  # C++ bindings build and test (Linux with lavapipe)
  cpp-linux:
    name: C++ Bindings (Linux)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koubaa/goldy/lavapipe-ci:latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Slang download deps
        run: |
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Download Slang
        run: cd slang && chmod +x download.sh && ./download.sh

      - name: Install build dependencies
        run: |
          apt-get update
          # GLFW (FetchContent) requires Wayland + X11 dev packages on Linux.
          apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev xorg-dev
          rm -rf /var/lib/apt/lists/*

      - name: Verify lavapipe
        run: DISPLAY= vulkaninfo --summary | head -30

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDY_BUILD_FROM_SOURCE=OFF \
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build

      - name: Run headless triangle example
        working-directory: cpp/build/examples
        run: |
          ./triangle_headless
          test -f triangle.ppm && echo "✓ triangle.ppm created successfully"

  # C++ bindings build and test (macOS with native Metal)
  cpp-macos:
    name: C++ Bindings (macOS)
    runs-on: macos-15
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          brew install cmake ninja

      - name: Download Slang
        run: cd slang && chmod +x download.sh && ./download.sh

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOLDY_BUILD_FROM_SOURCE=OFF \
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build

      - name: Run headless triangle example
        working-directory: cpp/build/examples
        run: |
          ./triangle_headless
          test -f triangle.ppm && echo "✓ triangle.ppm created successfully"

  # C++ bindings build (Windows)
  cpp-windows:
    name: C++ Bindings (Windows)
    runs-on: windows-latest
    needs: [check, test-mock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cpp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cpp-

      - name: Build Rust FFI library
        run: cargo build --package goldy-ffi --release

      - name: Configure CMake
        working-directory: cpp
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGOLDY_BUILD_FROM_SOURCE=OFF `
            -DGOLDY_BUILD_EXAMPLES=ON

      - name: Build C++ library and examples
        working-directory: cpp
        run: cmake --build build --config Release

      # Note: Can't run GPU tests on Windows CI without hardware
      # Just verify the build succeeds

