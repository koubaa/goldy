[package]
name = "goldy_derive"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Derive macros for goldy (compute kernels, LayoutCheckable, StructuredBufferElement, etc.)"
repository = "https://github.com/koubaa/goldy"
homepage = "https://koubaa.github.io/goldy/"
documentation = "https://docs.rs/goldy_derive"
readme = "README.md"
keywords = ["gpu", "graphics", "derive", "proc-macro"]
categories = ["graphics"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
goldy_shader_ir = { version = "0.2.0", path = "../shader_ir" }
