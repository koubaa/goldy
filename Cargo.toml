[workspace]
members = [".", "python", "ffi", "ffi-client", "derive", "shader_ir"]
resolver = "2"

[package]
name = "goldy"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Fondaco Machine GPU runtime for Rust (Vulkan, DX12, Metal)"
repository = "https://github.com/koubaa/goldy"
homepage = "https://koubaa.github.io/goldy/"
documentation = "https://docs.rs/goldy"
readme = "README.md"
keywords = ["gpu", "graphics", "vulkan", "rendering"]
categories = ["graphics", "rendering"]
autoexamples = false
exclude = [
    ".cursor/",
    ".github/",
    "cpp/",
    "derive/",
    "shader_ir/",
    "docker/",
    "docs/",
    "dotnet/",
    "ffi/",
    "ffi-client/",
    "python/",
    "scripts/",
    "AGENTS.md",
    "DEBUGGING.md",
    "PACKAGING.md",
    "RELEASING.md",
    "run_all_examples.sh",
]

# Allow unexpected_cfgs for objc crate's deprecated cargo-clippy cfg checks
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }

[dependencies]
goldy_derive = { version = "0.2.0", path = "derive" }
goldy_shader_ir = { version = "0.2.0", path = "shader_ir" }

# Vulkan bindings (native only)
ash = { version = "0.38", optional = true }

# Portable WebGPU backend
wgpu = { version = "29.0.3", optional = true }
pollster = { version = "0.4", optional = true }

# CUDA Driver API backend (compute-only prototype)
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-13010",
    "dynamic-loading",
] }

# Dynamic library loading for Slang compiler
libloading = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "2.0.18"

# Logging and instrumentation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracy-client = { version = "0.18", default-features = false, optional = true }

# Utilities
bitflags = "2.6"
rustc-hash = "2"
bytemuck = { version = "1.25.0", features = ["derive"] }
# Optional: `update-screenshots` binary only
image = { version = "0.25.10", optional = true }
dirs = "6.0"
scopeguard = "1.2"
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
zstd = "0.13"

# Windowing / Surface support (graphics feature)
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }

# DX12 dependencies (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

gpu-allocator = { version = "0.28", optional = true, features = ["d3d12"] }
windows-core = { version = "0.62", optional = true }

# Metal dependencies (macOS / iOS). `cocoa` is AppKit-only.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
core-graphics-types = { version = "0.2", optional = true }
foreign-types = { version = "0.5", optional = true }
block = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3"
libtest-mimic = "0.8"

# FLIP perceptual image comparison for screenshot tests
nv-flip = "0.1"
png = "0.18"

[features]
# Default enables all platform-appropriate backends plus graphics
# On macOS/iOS: metal is used, on Windows: dx12/vulkan, on Linux/Android: vulkan
default = ["vulkan", "metal", "dx12", "instrumentation", "graphics"]
# Raster, surfaces, render/present APIs. Native backends and `webgpu` imply this.
# Textures and samplers stay available without this feature (GPGPU).
graphics = ["dep:raw-window-handle"]
# Implied by every real GPU backend (not mock). Gate Instance::new() integration
# tests with `cfg(feature = "gpu")` instead of enumerating backends.
gpu = []
vulkan = ["dep:ash", "graphics", "gpu"]
dx12 = ["dep:windows", "dep:gpu-allocator", "dep:windows-core", "graphics", "gpu"]
metal = ["dep:metal", "dep:cocoa", "dep:objc", "dep:core-graphics-types", "dep:foreign-types", "dep:block", "graphics", "gpu"]
webgpu = ["dep:wgpu", "dep:pollster", "graphics", "gpu", "dep:objc"]
# NVIDIA CUDA compute-only prototype (Slang → PTX → Driver API)
cuda = ["dep:cudarc", "gpu"]
# Regenerate `tests/screenshots/*.png` via `cargo run --bin update-screenshots --features update-screenshots`
update-screenshots = ["dep:image"]
# Structured instrumentation with named observation points (zero-cost when disabled)
instrumentation = ["dep:tracing-subscriber"]
# Interactive `examples/*.rs` (winit); requires graphics for surfaces/present.
# Pulls instrumentation so examples can initialize `tracing_subscriber` under
# `--no-default-features` backend-only builds (e.g. cuda+graphics+dx12).
examples = ["dep:winit", "graphics", "instrumentation"]
# Tracy profiler integration — connect the Tracy GUI for live CPU/GPU timeline profiling.
# Zero-cost when disabled; when enabled, only collects when a profiler connects (on-demand).
tracy = ["dep:tracy-client", "tracy-client/enable", "tracy-client/ondemand", "tracy-client/broadcast", "tracy-client/system-tracing", "tracy-client/context-switch-tracing"]

