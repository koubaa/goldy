[package]
name = "rag"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust Abstract GPU - A modern GPU abstraction for Vulkan 1.4+, Metal, and DX12"
repository = "https://github.com/koubaa/rag"
keywords = ["gpu", "graphics", "vulkan", "rendering"]
categories = ["graphics", "rendering"]

[dependencies]
# Vulkan bindings (native only)
ash = { version = "0.38", optional = true }

# Dynamic library loading for Slang compiler
libloading = "0.8"

# wgpu for WebGPU backend (used on wasm32)
wgpu = { version = "24", optional = true }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Utilities
bitflags = "2.6"
bytemuck = { version = "1.21", features = ["derive"] }
scopeguard = "1.2"

# Windowing / Surface support
raw-window-handle = "0.6"
winit = { version = "0.30", optional = true }

# Web dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"], optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# DX12 dependencies (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
gpu-allocator = { version = "0.27", optional = true, features = ["d3d12"] }
windows-core = { version = "0.61", optional = true }

[dev-dependencies]
# PNG output for examples
image = "0.25"

# Tracing subscriber for examples
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windowing for interactive examples
winit = "0.30"

[features]
default = ["vulkan"]
vulkan = ["dep:ash"]
dx12 = ["dep:windows", "dep:gpu-allocator", "dep:windows-core"]
webgpu = ["dep:wgpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:console_error_panic_hook"]

