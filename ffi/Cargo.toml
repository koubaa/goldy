[package]
name = "goldy-ffi"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "C FFI bindings for the Goldy GPU library"
repository = "https://github.com/koubaa/goldy"
keywords = ["gpu", "graphics", "ffi", "c-bindings"]

[lib]
# `rlib` is required for Rust integration tests / examples; C interop uses cdylib/staticlib.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Core goldy library - default-features = false allows feature passthrough
goldy = { path = "..", default-features = false }

# Windowing for in-tree Rust examples (optional; see `examples` feature)
winit = { version = "0.30", optional = true }

# Error handling
anyhow = "1.0"

# For libc types
libc = "0.2"

# Thread-local storage for error messages
once_cell = "1.19"

# Raw window handles for surface creation
raw-window-handle = "0.6"

[dev-dependencies]
bytemuck = { version = "1.21", features = ["derive"] }

[[test]]
name = "task_graph_clear"
path = "tests/task_graph_clear.rs"

[build-dependencies]
# C header generation
cbindgen = "0.29"

[features]
# Default enables all platform-appropriate backends (same as goldy)
default = ["vulkan", "dx12", "metal"]
# Backend features pass through to goldy - only selected backends are compiled
vulkan = ["goldy/vulkan"]
dx12 = ["goldy/dx12"]
metal = ["goldy/metal"]
# Interactive Rust examples (`ffi/examples/`); enables winit on this crate and goldy
examples = ["dep:winit", "goldy/examples"]

[[example]]
name = "compute_simple"
path = "examples/compute_simple.rs"
required-features = ["examples"]
