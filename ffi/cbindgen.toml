# cbindgen configuration for generating goldy.h from goldy-ffi crate
# See: https://github.com/mozilla/cbindgen/blob/master/docs.md

# Header file settings
header = """/*
 * Goldy GPU Library - C API Header
 * 
 * Auto-generated by cbindgen. Do not edit manually.
 * 
 * MIT License - Copyright (c) 2025-2026 Mohamed Koubaa
 * 
 * This header provides the C API for the Goldy GPU library.
 * For C++ RAII wrappers, include goldy.hpp instead.
 */
"""

# No trailer needed - cbindgen handles extern "C" closing automatically

include_guard = "GOLDY_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify manually. */"
include_version = true

# Generate C header (not C++)
language = "C"
cpp_compat = true

# Style settings
tab_width = 4
style = "Both"
sort_by = "Name"
usize_is_size_t = true

# Documentation
documentation = true
documentation_style = "C99"
documentation_length = "Full"

# Braces style
braces = "SameLine"
line_length = 100
line_endings = "LF"

[defines]
# Feature flags that affect header generation

[export]
# Export all pub types and functions
include = []
exclude = []

[fn]
# Function settings
rename_args = "None"

[struct]
# How to generate struct field names
rename_fields = "None"

[enum]
# Enum generation settings - prefix variants with enum name to avoid conflicts
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[const]
# Constants generation
allow_static_const = true
allow_constexpr = false

[macro_expansion]
bitflags = true

[parse]
# Parse settings
parse_deps = false
clean = false

[parse.expand]
# Crates to expand macros from
crates = []
all_features = false
default_features = true
features = []
